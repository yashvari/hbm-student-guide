<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img"><style>text{font-family:Arial,sans-serif;fill:#17304a}.title{font-size:22px;font-weight:700}.body{font-size:16px}.small{font-size:14px}</style><rect width="1000" height="410" rx="20" fill="#eef5f7"/><text x="35" y="42" class="title">Your six-stage workflow</text><rect x="35" y="70" width="290" height="125" rx="14" fill="white" stroke="#c7dbe3"/><text x="53" y="102" class="small">01</text><text x="53" y="134" class="title">PREPARE</text><text x="53" y="166" class="body">Files, units, sources</text><rect x="360" y="70" width="290" height="125" rx="14" fill="white" stroke="#c7dbe3"/><text x="378" y="102" class="small">02</text><text x="378" y="134" class="title">STARTER</text><text x="378" y="166" class="body">Read and initialise</text><rect x="685" y="70" width="290" height="125" rx="14" fill="white" stroke="#c7dbe3"/><text x="703" y="102" class="small">03</text><text x="703" y="134" class="title">ENGINE</text><text x="703" y="166" class="body">Calculate the event</text><rect x="35" y="225" width="290" height="125" rx="14" fill="white" stroke="#c7dbe3"/><text x="53" y="257" class="small">04</text><text x="53" y="289" class="title">CHECK</text><text x="53" y="321" class="body">Energy, mass, motion</text><rect x="360" y="225" width="290" height="125" rx="14" fill="white" stroke="#c7dbe3"/><text x="378" y="257" class="small">05</text><text x="378" y="289" class="title">ANALYZE</text><text x="378" y="321" class="body">Forces and comparison</text><rect x="685" y="225" width="290" height="125" rx="14" fill="white" stroke="#c7dbe3"/><text x="703" y="257" class="small">06</text><text x="703" y="289" class="title">VISUALIZE</text><text x="703" y="321" class="body">Explain with an animation</text><text x="35" y="386" class="body">Read left to right, then continue on the next row. Check each output before moving on.</text></svg>