<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355" viewBox="0 0 1000 355" role="img"><style>text{font-family:Arial,sans-serif;fill:#17304a}.title{font-size:22px;font-weight:700}.body{font-size:16px}.small{font-size:14px}</style><rect width="1000" height="355" rx="20" fill="#eef5f7"/><text x="35" y="42" class="title">From connected pieces to a useful model</text><path d="M60 95 V255" stroke="#4f91ad" stroke-width="2"/><path d="M140 95 V255" stroke="#4f91ad" stroke-width="2"/><path d="M220 95 V255" stroke="#4f91ad" stroke-width="2"/><path d="M300 95 V255" stroke="#4f91ad" stroke-width="2"/><path d="M380 95 V255" stroke="#4f91ad" stroke-width="2"/><path d="M60 95 H380" stroke="#4f91ad" stroke-width="2"/><path d="M60 175 H380" stroke="#4f91ad" stroke-width="2"/><path d="M60 255 H380" stroke="#4f91ad" stroke-width="2"/><rect x="140" y="95" width="80" height="80" fill="#b7e2d8" stroke="#147b70" stroke-width="3"/><circle cx="60" cy="95" r="5" fill="#17304a"/><circle cx="60" cy="175" r="5" fill="#17304a"/><circle cx="60" cy="255" r="5" fill="#17304a"/><circle cx="140" cy="95" r="5" fill="#17304a"/><circle cx="140" cy="175" r="5" fill="#17304a"/><circle cx="140" cy="255" r="5" fill="#17304a"/><circle cx="220" cy="95" r="5" fill="#17304a"/><circle cx="220" cy="175" r="5" fill="#17304a"/><circle cx="220" cy="255" r="5" fill="#17304a"/><circle cx="300" cy="95" r="5" fill="#17304a"/><circle cx="300" cy="175" r="5" fill="#17304a"/><circle cx="300" cy="255" r="5" fill="#17304a"/><circle cx="380" cy="95" r="5" fill="#17304a"/><circle cx="380" cy="175" r="5" fill="#17304a"/><circle cx="380" cy="255" r="5" fill="#17304a"/><text x="60" y="295" class="body">Dots = nodes · Small regions = elements</text><text x="60" y="324" class="small">A flat mesh sketch, not the actual head geometry.</text><text x="480" y="100" class="title">A mesh needs more information:</text><text x="480" y="145" class="body">1. Material: how does each tissue respond?</text><text x="480" y="188" class="body">2. Loading: what makes the model move?</text><text x="480" y="231" class="body">3. Constraints: what is held in place?</text><text x="480" y="274" class="body">4. Contact: what happens when surfaces meet?</text></svg>